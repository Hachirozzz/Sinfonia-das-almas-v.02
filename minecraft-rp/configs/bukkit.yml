# Só o que foi mudado de propósito; o servidor completa o resto com os padrões.
# Valores iniciais do guia de otimização (github.com/YouHaveTrouble/minecraft-optimization).
settings:
  shutdown-message: Servidor fechado. Volte em instantes.
# Limite de criaturas por jogador conectado.
spawn-limits:
  monsters: 20
  animals: 5
  water-animals: 2
  water-ambient: 2
  water-underground-creature: 3
  axolotls: 3
  ambient: 1
# De quantos em quantos ticks o servidor tenta gerar cada tipo de criatura.
ticks-per:
  monster-spawns: 10
  animal-spawns: 400
  water-spawns: 400
  water-ambient-spawns: 400
  water-underground-creature-spawns: 400
  axolotl-spawns: 400
  ambient-spawns: 400
